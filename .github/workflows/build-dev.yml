name: Build-dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Set up uv and Python for backend security tests
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.12.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lockfile
        working-directory: app/dashboard
        run: uv lock --project ../.. --check

      - name: Sync locked backend environment
        working-directory: app/dashboard
        run: uv sync --project ../.. --locked --no-dev

      - name: Validate GitHub Actions workflows
        working-directory: app/dashboard
        run: bun run check:workflows

      - name: Verify installation inputs
        working-directory: app/dashboard
        run: bun run check:install

      - name: Install locked dependencies
        working-directory: app/dashboard
        run: bun install --frozen-lockfile

      - name: Lint and check frontend formatting
        working-directory: app/dashboard
        run: |
          bun run lint
          bun run format:check

      - name: Check frontend before publishing
        working-directory: app/dashboard
        env:
          INSTALL_COLD_CACHE: "1"
        run: |
          bun --bun run typecheck
          bun run test
          bun run test:installation

      - name: Build project
        working-directory: app/dashboard
        run: bun --bun run build --outDir build --assetsDir statics
        env:
          VITE_BASE_API: /api/

      - name: Create 404.html
        working-directory: app/dashboard
        run: cp ./build/index.html ./build/404.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gozargah/marzban:${{ github.ref_name }}
            ghcr.io/gozargah/marzban:${{ github.ref_name }}
